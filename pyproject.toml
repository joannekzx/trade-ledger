[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar-bitemporal"
version = "0.1.0"
description = "Bitemporal store for SEC EDGAR XBRL company facts (Postgres + Python + SQL)"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary",
    "pandas",
    "requests",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
